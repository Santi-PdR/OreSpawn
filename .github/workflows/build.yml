name: Build Forge 1.20.1

on:
  push:
    branches: [ main, 'work/**', 'feature/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orespawn-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check project is present
        id: project
        shell: bash
        run: |
          if [[ -f build.gradle && -d src ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "El repo todavía no contiene el checkpoint del proyecto."
            echo "Cuando se suban build.gradle + src/, este workflow compilará automáticamente."
          fi

      - name: Set up Java 17
        if: steps.project.outputs.ready == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.1.1
        if: steps.project.outputs.ready == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Build mod
        if: steps.project.outputs.ready == 'true'
        run: gradle build --no-daemon --stacktrace

      - name: Find final JAR
        if: steps.project.outputs.ready == 'true'
        id: jar
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)"
          if [[ -z "$JAR" || ! -f "$JAR" ]]; then
            echo "No se encontró el JAR final en build/libs" >&2
            find build/libs -maxdepth 1 -type f -printf '  %f\n' >&2 || true
            exit 1
          fi

          unzip -t "$JAR" >/dev/null
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$JAR" .jar)" >> "$GITHUB_OUTPUT"
          sha256sum "$JAR"

      - name: Validate Mining Dimension datapack in final JAR
        if: steps.project.outputs.ready == 'true'
        env:
          MOD_JAR: ${{ steps.jar.outputs.jar }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import zipfile

          jar = os.environ["MOD_JAR"]
          prefix = "data/copyl/"
          entries = {
              "dimension": "dimension/mining.json",
              "dimension_type": "dimension_type/mining.json",
              "biome": "worldgen/biome/mining_biome.json",
              "noise": "worldgen/noise_settings/mining.json",
          }
          with zipfile.ZipFile(jar) as archive:
              data = {}
              for key, relative_path in entries.items():
                  path = prefix + relative_path
                  assert path in archive.namelist(), f"Missing {path} in final mod JAR"
                  data[key] = json.loads(archive.read(path))

          dimension = data["dimension"]
          generator = dimension["generator"]
          assert dimension["type"] == "copyl:mining"
          assert generator["type"] == "minecraft:noise"
          assert generator["biome_source"] == {
              "type": "minecraft:fixed",
              "biome": "copyl:mining_biome",
          }
          assert generator["settings"] == "copyl:mining"

          dimension_type = data["dimension_type"]
          settings = data["noise"]
          noise = settings["noise"]
          assert settings["aquifers_enabled"] is False
          assert settings["legacy_random_source"] is True
          assert settings["ore_veins_enabled"] is False
          biome_features = [feature for step in data["biome"]["features"] for feature in step]
          assert "minecraft:ore_copper" not in biome_features
          assert "copyl:worldgen_ores" in biome_features
          assert dimension_type["min_y"] == noise["min_y"] == 0
          assert dimension_type["height"] == noise["height"] == 256
          assert data["biome"]["spawners"]["monster"]
          assert data["biome"]["spawners"]["creature"]
          print("Mining Dimension registry resources and references are present in the final JAR.")
          PY

      - name: Upload compiled JAR
        if: steps.project.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.jar.outputs.name }}
          path: ${{ steps.jar.outputs.jar }}
          if-no-files-found: error
          retention-days: 30
