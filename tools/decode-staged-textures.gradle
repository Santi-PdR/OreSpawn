// Binary-safe bridge for original OreSpawn assets while working through the text-only connector.
// Supports both a normal `file.png.b64` and chunked `file.png.b64.part01`, `part02`, ... files.

def stagedRoot = file('src/main/resources')
def decodedRoot = file("$buildDir/generated-binary-resources")

tasks.register('decodeStagedBinaryResources') {
    inputs.files(fileTree(stagedRoot) { include '**/*.b64'; include '**/*.b64.part*' })
    outputs.dir(decodedRoot)

    doLast {
        delete(decodedRoot)

        // Normal Base64 files.
        stagedRoot.eachFileRecurse { staged ->
            if (staged.isFile() && staged.name.endsWith('.b64')) {
                def relative = stagedRoot.toPath().relativize(staged.toPath()).toString()
                def target = new File(decodedRoot, relative.substring(0, relative.length() - 4))
                target.parentFile.mkdirs()
                target.bytes = staged.text.trim().decodeBase64()
            }
        }

        // Large textures can be split into deterministic text chunks so no binary asset is altered.
        def chunkGroups = [:].withDefault { [] }
        stagedRoot.eachFileRecurse { staged ->
            if (staged.isFile() && staged.name ==~ /.*\.b64\.part\d+$/) {
                def relative = stagedRoot.toPath().relativize(staged.toPath()).toString()
                def base = relative.replaceFirst(/\.b64\.part\d+$/, '')
                chunkGroups[base] << staged
            }
        }

        chunkGroups.each { relativeTarget, parts ->
            parts.sort { a, b -> a.name <=> b.name }
            def encoded = new StringBuilder()
            parts.each { encoded.append(it.text.trim()) }
            def target = new File(decodedRoot, relativeTarget)
            target.parentFile.mkdirs()
            target.bytes = encoded.toString().decodeBase64()
        }
    }
}

sourceSets.main.resources.srcDir(decodedRoot)

tasks.named('processResources') {
    dependsOn tasks.named('decodeStagedBinaryResources')
    exclude '**/*.b64'
    exclude '**/*.b64.part*'
    exclude '**/README-alien-texture.txt'
}
